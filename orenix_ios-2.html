<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000"><title>Orenix Game</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--c2:#2c2c2e;--fill:rgba(120,120,128,.24);--ln:rgba(84,84,88,.5);--tx:#fff;--sub:rgba(235,235,245,.6);--or:#ff9f0a;--or2:#ff6b00;--ok:#30d158;--bad:#ff453a;
--glass:rgba(28,28,30,.72);--ease:cubic-bezier(.22,.8,.24,1);--spring:cubic-bezier(.2,1.25,.35,1);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}input{font:inherit;color:inherit;letter-spacing:inherit}a{color:inherit;text-decoration:none}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.st{width:1em;height:1em;color:#ffb400;vertical-align:-.13em;flex:none}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#app:before{content:"";position:absolute;left:-20%;right:-20%;top:-120px;height:420px;background:radial-gradient(closest-side,rgba(255,120,10,.32),transparent);pointer-events:none;transition:transform .8s var(--ease)}

.sp{flex:1}
.bal{display:flex;align-items:center;gap:7px;padding:5px 5px 5px 13px;border-radius:99px;background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:.5px solid var(--ln);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;transition:transform .3s var(--spring)}
.bal:active{transform:scale(.94)}.bal i{width:28px;height:28px;border-radius:50%;background:linear-gradient(180deg,#ffb340,#ff7a00);display:grid;place-items:center;color:#2a1200}.bal i svg{width:16px;height:16px;stroke-width:2.8}

.lt{font-size:34px;font-weight:700;letter-spacing:-.8px;margin:10px 2px 12px}

.sub{color:var(--sub);font-size:14px}.pos{color:var(--ok)}.neg{color:var(--bad)}.empty{color:var(--sub);text-align:center;padding:28px 0;font-size:15px}

#v.rise>*{animation:rise .55s var(--ease) both}#v.rise>*:nth-child(2){animation-delay:.04s}#v.rise>*:nth-child(3){animation-delay:.08s}#v.rise>*:nth-child(4){animation-delay:.12s}#v.rise>*:nth-child(5){animation-delay:.16s}#v.rise>*:nth-child(n+6){animation-delay:.2s}

.gf{display:grid;place-items:center;color:rgba(255,255,255,.55)}.gf svg{width:55%;height:55%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.gc:active{transform:scale(.95)}.gc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 45%);pointer-events:none}
.gc .gi,.gc .gf{position:absolute;right:-8px;top:2px;width:112px;height:112px;transform:rotate(9deg);transition:transform .5s var(--spring)}.gc:active .gi{transform:rotate(3deg) scale(1.06)}
.gc b{font-size:20px;font-weight:700;position:relative}.gc small{color:rgba(255,255,255,.72);font-size:13px;position:relative}
.tabs{display:flex;padding:3px;border-radius:10px;background:var(--fill);margin:0 0 14px}.tabs span{flex:1;text-align:center;padding:7px;border-radius:8px;font-size:14px;font-weight:600;color:var(--sub);transition:all .25s}.tabs span.on{background:#636366;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.cc{position:relative;height:190px;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px;box-shadow:inset 0 .5px 0 rgba(255,255,255,.28),0 10px 26px rgba(0,0,0,.4);transition:transform .35s var(--spring)}
.cc:active{transform:scale(.95)}.cc .gi,.cc .gf{width:104px;height:104px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:99px;background:rgba(0,0,0,.42);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:15px;font-weight:700}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:16px;background:linear-gradient(180deg,#ffb340,#ff8a00 55%,#ff6b00);color:#2a1200;font-weight:600;font-size:17px;box-shadow:0 8px 20px rgba(255,110,0,.35),inset 0 .5px 0 rgba(255,255,255,.55);transition:transform .3s var(--spring),opacity .2s}
.btn .st{color:#2a1200}.btn.g .st,.btn.o .st{color:#ffb400}.btn:active{transform:scale(.96)}.btn[disabled]{opacity:.35;pointer-events:none}
.btn.g{background:var(--fill);color:var(--or);box-shadow:none}.btn.o{background:rgba(255,159,10,.16);color:var(--or);box-shadow:none}.btn.y{}

.ri{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}.ri svg{width:19px;height:19px}.ri.a{background:linear-gradient(#ffb340,#ff7a00)}.ri.b{background:linear-gradient(#34c759,#1f9d3f)}.ri.c{background:linear-gradient(#0a84ff,#0060d0)}.ri.d{background:linear-gradient(#bf5af2,#8a2be2)}
.rw .t{flex:1;min-width:0}.rw .t small{display:block;color:var(--sub);font-size:13px;font-weight:400}.rw>svg.ch{width:16px;height:16px;color:rgba(235,235,245,.3);stroke-width:2.4}
.li{display:flex;align-items:center;gap:12px;padding:12px 0}.li+.li{border-top:.5px solid var(--ln)}.li .t{flex:1;min-width:0}.li small{color:var(--sub);display:block;font-size:13px}

function gshell(t,body,btn){$('g').innerHTML=`<div class="top"><button onclick="closeG()">${ic('chev')}Назад</button><span class="tb">${ST}<span id="gb">${fmt(S.stars)}</span></span></div><h1>${t}</h1>${body}<div class="res" id="res"></div>${betBox()}<button class="btn" id="go" onclick="${btn}">Играть</button>`;$('g').classList.add('on')}
function closeG(){if(busy)return;$('g').classList.remove('on');load().then(render)}
function openG(k){k==='crash'||k==='limbo'?oCrash(k):k==='hilo'?oHilo():oWheel()}
let CG='crash';function oCrash(g){CG=g||'crash';gshell(CG==='limbo'?'Limbo':'Краш',`<div class="sub" style="position:relative">Выбери авто-вывод и лови множитель</div><div class="stage"><div class="mx" id="mx">x1.00</div><div id="rk">${RK}</div></div><div class="chips" id="ch">${[1.5,2,3,5,10].map(m=>`<button class="${m===tgt?'on':''}" onclick="tgt=${m};saveUI();pick('ch',this)">x${m}</button>`).join('')}</div>`,'goCrash()')}
function pick(id,b){document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');vib()}
function goCrash(){$('mx').className='mx';$('rk').innerHTML=RK;$('rk').style.transform='';run(CG,{target:tgt},bet,async r=>{
 const stop=r.win>0?tgt:r.result,T=Math.min(4500,Math.max(700,Math.log(stop)/.3*1000)),t0=performance.now(),el=$('mx'),rk=$('rk');
 await new Promise(ok=>{(function f(t){const k=Math.min(1,(t-t0)/T);el.textContent='x'+Math.exp(Math.log(stop)*k).toFixed(2);rk.style.transform=`translate(${k*190}px,${-k*120}px)`;k<1?requestAnimationFrame(f):ok()})(t0)});
 if(r.win>0)el.className='mx pos';else{el.className='mx neg';rk.innerHTML=BOOM;rk.firstChild.style.transform='none';rk.style.color='var(--bad)'}})}
const PC=['#ff9f0a','#ff6b00','#ffd60a','#ff453a','#ffb340','#c93400'];let pt=null,lastR=null;
async function rPvp(){
 $('v').innerHTML=lt('ПвП')+`<div class="two" style="margin-top:0"><div class="uc" style="text-align:left;padding:12px 16px"><small>Предыдущая игра</small><b id="pl" style="font-size:16px;margin:4px 0 0;justify-content:flex-start">—</b></div><div class="uc" style="padding:12px 16px"><small>Банк</small><b id="pt2" style="font-size:20px;margin:4px 0 0">0</b></div></div><div class="ring" style="margin:18px auto"><div style="position:absolute;left:50%;top:-12px;margin-left:-10px;border:10px solid transparent;border-top:18px solid #fff;z-index:2"></div><div id="pw" style="width:100%;height:100%;border-radius:50%;border:4px solid rgba(255,255,255,.12);background:#1c1c1e;transition:background .6s"></div><div class="c" style="font-size:28px"><div id="ptm" style="width:116px;height:116px;border-radius:50%;background:#000;border:3px solid rgba(255,255,255,.9);display:grid;place-items:center;font-variant-numeric:tabular-nums">—</div></div></div>${betBox()}<button class="btn" onclick="pvpJoin()">${ic('plus')}Войти в раунд</button><h3 id="pn">Игроки</h3><div class="inv" id="plist"></div>`;
 clearInterval(pt);pvpTick();pt=setInterval(()=>tab==='pvp'?pvpTick():clearInterval(pt),1500)}
async function pvpTick(){let s;try{s=await B.pvp()}catch(e){toast(e.message);return}if(tab!=='pvp'||!$('pw'))return;const P=s.players||[],tot=P.reduce((a,x)=>a+x.amount,0);let a=0;
 $('pw').style.background=P.length?`conic-gradient(${P.map((x,i)=>{const f=a/tot*360;a+=x.amount;return`${PC[i%6]} ${f}deg ${a/tot*360}deg`}).join(',')})`:'#1c1c1e';
 $('pt2').innerHTML=ST+fmt(tot);$('ptm').textContent=s.left==null?(P.length?'Ждём':'—'):'00:'+String(s.left).padStart(2,'0');$('pn').textContent=P.length+' игроков';
 $('plist').innerHTML=P.map((x,i)=>`<div class="li"><span style="width:12px;height:12px;border-radius:50%;background:${PC[i%6]}"></span><div class="t"><b>${esc(x.name)}</b></div><b style="display:flex;align-items:center;gap:4px">${ST}${fmt(x.amount)} <span class="sub">${(x.amount/tot*100).toFixed(0)}%</span></b></div>`).join('')||'<div class="empty">Раунд пуст</div>';
 if(s.last){$('pl').textContent=s.last.name+' +'+fmt(s.last.win);if(lastR!==null&&lastR!==s.last.id){toast('Победил '+s.last.name+' +'+fmt(s.last.win));load()}lastR=s.last.id}else if(lastR===null)lastR=0}
async function pvpJoin(){try{await B.pvpJoin(bet);vib();await load();pvpTick()}catch(e){toast(e.message)}}

/* Магазин */
async function rShop(){let L=[];try{L=await B.shop()}catch(e){toast(e.message)}
 $('v').innerHTML=lt('Магазин')+`<div class="grid">${L.map(x=>`<button class="cc" style="background:linear-gradient(160deg,#ff9f0a,#8f2c00);height:196px" onclick="oBuy(${x.id},'${esc(x.name).replace(/'/g,'')}',${x.price})">${gi(/^https?:/.test(x.emoji||'')?x.emoji:x.name)}<span class="nm">${esc(x.name)}</span><span class="chip">${ST}${fmt(x.price)}</span></button>`).join('')||'<div class="empty" style="grid-column:span 2">Скоро здесь появятся товары</div>'}</div>`}
function oBuy(id,name,price){sheet(`<div style="text-align:center"><div style="width:140px;height:140px;margin:6px auto 8px">${gi(name)}</div><span class="tt" style="margin-bottom:4px">${name}</span><div class="sub" style="margin-bottom:16px;display:flex;justify-content:center;align-items:center;gap:4px">Цена ${ST}${fmt(price)}</div><button class="btn" onclick="act('buy',${id})">Купить</button></div>`)}

/* Розыгрыши */
const tl=l=>`${Math.floor(l/3600)}ч ${Math.floor(l%3600/60)}м ${l%60}с`;
async function rGv(){if(DEMO){$('v').innerHTML='<div class="empty">Розыгрыши работают только при подключённом сервере</div>';return}
 let L=[];try{L=await B.gv()}catch(e){toast(e.message)}
 $('v').innerHTML=lt('Награды')+`<div class="sub" style="margin:-6px 2px 4px">Играй и получай шанс выиграть призы</div>`+L.map(g=>`<div class="gvc">${gi(TIER[(g.id||0)%TIER.length])}<b>${esc(g.title)}</b><div style="display:flex;align-items:center;gap:4px;margin-top:2px">Приз: ${ST}${fmt(g.prize)}</div><div class="sub" data-l="${g.left}">${tl(g.left)}</div><div class="sub" style="margin-top:6px;max-width:62%">Сыграй на ${fmt(g.min)}+ · участников ${g.n}</div><button class="btn" style="margin-top:12px;max-width:62%" ${g.joined?'disabled':''} onclick="act('gvJoin',${g.id})">${g.joined?'Вы участвуете':'Участвовать'}</button></div>`).join('')}
setInterval(()=>document.querySelectorAll('[data-l]').forEach(e=>{const l=Math.max(0,e.dataset.l-1);e.dataset.l=l;e.textContent=tl(l)}),1000);

/* Hi Lo */
let hg='hi';
function oHilo(){gshell('Hi Lo',`<div class="stage"><div class="mx" id="mx">? → ?</div></div><div class="chips" id="hc"><button class="on" onclick="hg='hi';pick('hc',this)">Выше</button><button onclick="hg='lo';pick('hc',this)">Ниже</button></div><div class="sub" style="position:relative">Карты 2–14, при равенстве проигрыш. Выплата x2</div>`,'goHilo()')}
function goHilo(){$('mx').className='mx';run('hilo',{guess:hg},bet,async r=>{const[a,b]=String(r.result).split(',');$('mx').textContent=a+' → '+b;await sleep(500);$('mx').className='mx '+(r.win>0?'pos':'neg')})}

/* Сезон */
async function rSeason(){$('v').innerHTML=lt('Сезон')+'<div class="empty">Загрузка…</div>';let L=[];try{L=await B.lead()}catch(e){toast(e.message)}
 $('v').innerHTML=lt('Сезон')+`<div class="stage" style="height:140px;color:var(--or)">${ic('trophy').replace('class="ic ','style="width:76px;height:76px;stroke-width:1.3" class="ic ')}</div><div class="inv">${L.length?L.map((x,i)=>`<div class="li"><span style="width:30px;font-weight:700;font-size:${i<3?20:16}px;color:${i<3?'var(--or)':'var(--sub)'}">${i+1}</span><div class="t"><b>${esc(x.name)}</b><small>${ST}${fmt(x.wagered)} · ${lv(x.wagered)} уровень</small></div></div>`).join(''):'<div class="empty">Пока никого</div>'}</div>`}

/* Lucky */
let SL=['0','2','0','0.5','1','0','5','0.5','3','10'];
function oWheel(){const n=SL.length,sl=360/n,col=['#ff9f0a','#ffcf6b'];
 const gr=SL.map((m,i)=>`${m==='0'?'#3a1d0a':col[i%2]} ${i*sl}deg ${(i+1)*sl}deg`).join(',');
 const lb=SL.map((m,i)=>`<b style="transform:rotate(${i*sl+sl/2}deg)"><i${m==='0'?' style="color:#ffb98a"':''}>${m}×</i></b>`).join('');
 gshell('Lucky',`<div class="stage" style="height:290px"><div class="w"><div class="wh" id="wh" style="background:conic-gradient(${gr});transform:rotate(${wr}deg)">${lb}</div></div></div>`,'goWheel()')}
function goWheel(){run('wheel',{},bet,async r=>{const k=String(r.result),ix=SL.map((m,i)=>m===k?i:-1).filter(i=>i>=0),i=ix[Math.floor(Math.random()*ix.length)],sl=360/SL.length,a=i*sl+sl/2+(Math.random()-.5)*sl*.6;
 wr+=2160+((360-a)-wr%360+360)%360;$('wh').style.transform=`rotate(${wr}deg)`;await sleep(4300)})}

/* Старт */
document.body.dataset.t=tab;initUser();const SP=WA&&WA.initDataUnsafe&&WA.initDataUnsafe.start_param;if(!DEMO&&SP&&/^ref\d+$/.test(SP))rpc('set_ref',{p_ref:+SP.slice(3)}).catch(()=>{});
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
(async()=>{if(!CFG.SUPABASE_URL){$('v').innerHTML='<div class="empty">Не задан SUPABASE_URL в настройках</div>';return}
  try{const c=await B.cfg();CFG.MIN=c.min_bet;CFG.MAX=c.max_bet;CFG.LOCK_H=c.lock_hours;if(c.case_m)CASE_M=c.case_m;if(c.wheel_m)SL=c.wheel_m.map(String);if(c.announce)toast(c.announce)}catch(e){}
  try{await load();render()}catch(e){$('v').innerHTML='<div class="empty">'+esc(e.message)+'</div>'+(/signature|session/i.test(e.message)?diag():'')}})();
setInterval(()=>{if(S&&tab==='me'&&!busy&&S.nfts.some(n=>lock(n)))render()},60000);
</script></body></html>
